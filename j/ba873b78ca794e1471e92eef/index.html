<script>
(async () => {
  const m = document.getElementById('m');
  try {
    const q = new URLSearchParams(location.hash.slice(1));
    let k = q.get('k');
    if (k) { try { localStorage.setItem('tjk', k); } catch (e) {} } else { try { k = localStorage.getItem('tjk'); } catch (e) {} }
    if (!k) { m.textContent = 'This page needs the private link from your Telegram bot.'; return; }
    const raw = Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const iv = Uint8Array.from(atob('9vIJCmvILgVE0L5b'), c => c.charCodeAt(0));
    const data = Uint8Array.from(atob(document.getElementById('d').textContent.trim()), c => c.charCodeAt(0));
    const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    let html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    // keep the desktop-app manifest after the page is replaced (10/31)
    html = html.replace(/<head([^>]*)>/i, '<head$1><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0b0f17">');
    document.open(); document.write(html); document.close();
